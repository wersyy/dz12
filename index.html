<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="menu">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <h1>FlexBox</h1>
    </header>

    <main>
        <div class="container">

            <!-- 1 ряд -->
            <div class="box">
                <div class="items top">
                    <div></div><div></div><div></div>
                </div>
            </div>

            <div class="box">
                <div class="items column">
                    <div></div><div></div><div></div>
                </div>
            </div>

            <div class="box">
                <div class="items top">
                    <div></div><div></div><div></div><div></div>
                </div>
                <div class="items left">
                    <div></div>
                </div>
            </div>

            <div class="box">
                <div class="items space">
                    <div></div><div></div><div></div>
                </div>
            </div>

            <!-- 2 ряд -->
            <div class="box">
                <div class="items top">
                    <div></div><div></div><div></div>
                </div>
            </div>

            <div class="box">
                <div class="items right">
                    <div></div><div></div><div></div>
                </div>
            </div>

            <div class="box">
                <div class="items right">
                    <div></div><div></div><div></div>
                </div>
            </div>

            <div class="box">
                <div class="items space">
                    <div></div><div></div><div></div>
                </div>
            </div>

            <!-- 3 ряд -->
            <div class="box">
                <div class="items top">
                    <div></div><div></div><div></div>
                </div>
            </div>

            <div class="box">
                <div class="items bottom">
                    <div></div><div></div><div></div>
                </div>
            </div>

            <div class="box">
                <div class="items center">
                    <div></div><div></div><div></div>
                </div>
            </div>

            <div class="box">
                <div class="items space">
                    <div></div><div></div><div></div>
                </div>
            </div>

        </div>
    </main>

    <section class="buttons">
        <button>Sign up</button>
        <button class="login">Log in</button>
    </section>

</body>
</html>
